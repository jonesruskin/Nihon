<!doctype html>
<html><head><meta charset="utf-8"><title>Crowd viewer</title>
<style>html,body{margin:0;background:#9aa;overflow:hidden}</style></head>
<body><script type="module">
import * as THREE from 'three'
import { RoomEnvironment } from 'three/examples/jsm/environments/RoomEnvironment.js'
import { loadCrowdArchetypes, createCrowdMesh, crowdTime } from '/src/people/crowdModels.ts'
const q = new URLSearchParams(location.search)
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true })
renderer.setSize(innerWidth, innerHeight)
renderer.toneMapping = THREE.AgXToneMapping
renderer.shadowMap.enabled = true
document.body.appendChild(renderer.domElement)
const scene = new THREE.Scene()
scene.background = new THREE.Color(0xb8c4c8)
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture
const sun = new THREE.DirectionalLight(0xffffff, 2.5); sun.position.set(-6, 12, 8); sun.castShadow = true
sun.shadow.camera.left = sun.shadow.camera.bottom = -20; sun.shadow.camera.right = sun.shadow.camera.top = 20; sun.shadow.mapSize.set(2048, 2048); scene.add(sun)
const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.MeshStandardMaterial({ color: 0x77736c, roughness: 0.9 })); ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground)
const arch = await loadCrowdArchetypes()
const m4 = new THREE.Matrix4(), qq = new THREE.Quaternion(), up = new THREE.Vector3(0, 1, 0)
arch.forEach((a, i) => {
  const mesh = createCrowdMesh(a, 4)
  mesh.count = 2
  const anim = mesh.geometry.getAttribute('aAnim')
  const tint = mesh.geometry.getAttribute('aTint')
  const P = [[0.05,0.06,0.09],[0.02,0.02,0.02],[0.12,0.12,0.13],[0.45,0.38,0.28],[0.7,0.7,0.68],[0.15,0.17,0.1],[0.25,0.13,0.08],[0.08,0.12,0.25]]
  for (let k = 0; k < 2; k++) {
    const clip = k === 0 ? a.frames.walk : a.frames.idle
    const x = (i % 7) * 1.4 - 4.2, z = Math.floor(i / 7) * 2.4 - 1 + k * 1.1
    qq.setFromAxisAngle(up, Number(q.get('yaw') ?? 0.5))
    mesh.setMatrixAt(k, m4.compose(new THREE.Vector3(x, 0, z), qq, new THREE.Vector3(1, 1, 1)))
    anim.setXYZW(k, clip[0], clip[1], Math.random(), 0.9)
    const c = P[(i * 3 + k * 5) % P.length]
    tint.setXYZW(k, c[0], c[1], c[2], 0.85)
  }
  anim.needsUpdate = true
  tint.needsUpdate = true
  scene.add(mesh)
})
crowdTime.value = Number(q.get('t') ?? 0.3)
const cam = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 200)
cam.position.set(0, Number(q.get('cy') ?? 2.2), Number(q.get('cz') ?? 11)); cam.lookAt(0, 0.9, 0)
renderer.render(scene, cam)
window.ready = true
</script></body></html>
