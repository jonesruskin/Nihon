<!doctype html>
<html><head><meta charset="utf-8"><title>Ferry viewer</title>
<style>html,body{margin:0;background:#9aa;overflow:hidden}</style></head>
<body><script type="module">
import * as THREE from 'three'
import { RoomEnvironment } from 'three/examples/jsm/environments/RoomEnvironment.js'
import { createFerry } from '/src/transit/ferryModel.ts'
const q = new URLSearchParams(location.search)
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true })
renderer.setSize(innerWidth, innerHeight)
renderer.toneMapping = THREE.AgXToneMapping
renderer.shadowMap.enabled = true
document.body.appendChild(renderer.domElement)
const scene = new THREE.Scene()
scene.background = new THREE.Color(0xb8c8d4)
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture
const sun = new THREE.DirectionalLight(0xffffff, 2.4); sun.position.set(-60, 80, 50); sun.castShadow = true
sun.shadow.camera.left = sun.shadow.camera.bottom = -120; sun.shadow.camera.right = sun.shadow.camera.top = 120; sun.shadow.mapSize.set(2048, 2048); scene.add(sun)
const sea = new THREE.Mesh(new THREE.PlaneGeometry(800, 800), new THREE.MeshStandardMaterial({ color: 0x2c4a5a, roughness: 0.3, metalness: 0.2 })); sea.rotation.x = -Math.PI / 2; sea.receiveShadow = true; scene.add(sea)
const kms = (q.get('km') ?? '2,20,300').split(',').map(Number)
let x = 0
for (const km of kms) {
  const f = createFerry(km, km * 0.37)
  f.group.position.set(x, 0, 0)
  scene.add(f.group)
  const dot = new THREE.Mesh(new THREE.SphereGeometry(0.4), new THREE.MeshBasicMaterial({ color: 0xff00ff }))
  dot.position.set(x + f.deck.x, f.deck.y + 0.4, f.deck.z); scene.add(dot)
  x += f.length < 50 ? 25 : f.length < 100 ? 40 : 60
}
const cam = new THREE.PerspectiveCamera(Number(q.get('fov') ?? 35), innerWidth / innerHeight, 0.1, 2000)
cam.position.set(Number(q.get('cx') ?? 150), Number(q.get('cy') ?? 60), Number(q.get('cz') ?? 170)); cam.lookAt(x / 2 - 30, 5, 0)
renderer.render(scene, cam)
window.ready = true
</script></body></html>
