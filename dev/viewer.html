<!doctype html>
<html><head><meta charset="utf-8"><title>Character viewer</title>
<style>html,body{margin:0;background:#9aa;overflow:hidden}</style></head>
<body><script type="module">
import * as THREE from 'three'
import { CharacterLibrary } from '/src/people/CharacterLibrary.ts'
const q = new URLSearchParams(location.search)
const names = (q.get('names') ?? 'player_m').split(',')
const speed = Number(q.get('speed') ?? 1.35)
const t = Number(q.get('t') ?? 0.3)
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true })
renderer.setSize(innerWidth, innerHeight)
renderer.outputColorSpace = THREE.SRGBColorSpace
renderer.toneMapping = THREE.AgXToneMapping
document.body.appendChild(renderer.domElement)
const scene = new THREE.Scene()
scene.background = new THREE.Color(0xb8c4c8)
scene.add(new THREE.HemisphereLight(0xdde8ff, 0x665544, 1.6))
const sun = new THREE.DirectionalLight(0xffffff, 2.5); sun.position.set(3, 6, 4); scene.add(sun)
const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color: 0x777777 })); ground.rotation.x = -Math.PI / 2; scene.add(ground)
const cam = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.1, 100)
const n = names.length
cam.position.set(Number(q.get('cx') ?? 4.5), 1.4, Number(q.get('cz') ?? 0) + n * 2.4)
cam.lookAt(0, 0.95, 0)
const lib = new CharacterLibrary(); await lib.init()
const people = []
for (let i = 0; i < n; i++) {
  const p = await lib.create(names[i]); p.object.position.x = (i - (n - 1) / 2) * 0.9
  p.object.rotation.y = Number(q.get('ry') ?? -Math.PI / 2)
  scene.add(p.object); people.push(p)
}
for (const p of people) { for (let k = 0; k < 20; k++) p.update(0.05, speed) ; p.mixer.setTime(t) }
renderer.render(scene, cam)
window.ready = true
</script></body></html>
